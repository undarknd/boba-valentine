<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For My Boba 💕</title>
    <style>
        body {
            background-color: #f8f8f8;
            font-family: 'Comic Sans MS', cursive, sans-serif;
            text-align: center;
            color: #ff66b2;
            overflow: hidden;
            position: relative;
        }
        h1 {
            font-size: 2.5em;
        }
        .container {
            padding: 20px;
        }
        .button {
            background-color: #ff99cc;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            font-size: 1.2em;
        }
        .hidden {
            display: none;
        }
        .gallery img {
            width: 100px;
            border-radius: 10px;
            margin: 5px;
        }
        .heart {
            position: absolute;
            width: 20px;
            height: 20px;
            background-color: #99ccff;
            clip-path: polygon(50% 0%, 100% 35%, 75% 100%, 50% 75%, 25% 100%, 0% 35%);
            animation: float 5s infinite;
            opacity: 0.7;
        }
        @keyframes float {
            0% { transform: translateY(100vh); }
            100% { transform: translateY(-10vh); }
        }
    </style>
</head>
<body>
    <script>
        function createHearts() {
            for (let i = 0; i < 20; i++) {
                let heart = document.createElement("div");
                heart.classList.add("heart");
                heart.style.left = Math.random() * 100 + "vw";
                heart.style.animationDuration = Math.random() * 3 + 2 + "s";
                document.body.appendChild(heart);
                setTimeout(() => heart.remove(), 5000);
            }
        }
        setInterval(createHearts, 1000);
    </script>
    
    <div class="container">
        <h1>Hey boba, my sweetest OmOm! 🧋🩵💕🍬🤍💗 Happy Valentine's Day mi amore</h1>
        <button class="button" onclick="showLoveLetter()">Open Love Letter 💌</button>
        <div id="loveLetter" class="hidden">
            <p>To my dearest Boba, my one and only Omom... You are my sunshine, my happiness, my everything. Happy Valentine's Day! 💖</p>
        </div>
        <button class="button" onclick="showGallery()">See Our Memories 📸</button>
        <div id="gallery" class="gallery hidden">
            <img src="pic1.jpg" alt="Memory 1">
            <img src="pic2.jpg" alt="Memory 2">
            <img src="pic3.jpg" alt="Memory 3">
        </div>
        <button class="button" onclick="startQuiz()">Take Our Love Quiz 💖</button>
        <div id="quiz" class="hidden">
            <p>What is our favorite date spot?</p>
            <button class="button">A) The café ☕</button>
            <button class="button">B) The park 🌳</button>
            <p>What is our favorite song?</p>
            <button class="button">A) Our special song 🎶</button>
            <button class="button">B) A random song 🎵</button>
        </div>
        <button class="button" onclick="showCountdown()">Countdown to Our Next Adventure ⏳</button>
        <div id="countdown" class="hidden">
            <p>Countdown to our special day: <span id="timer"></span></p>
        </div>
    </div>

    <script>
        function showLoveLetter() {
            document.getElementById('loveLetter').classList.toggle('hidden');
        }
        function showGallery() {
            document.getElementById('gallery').classList.toggle('hidden');
        }
        function startQuiz() {
            document.getElementById('quiz').classList.toggle('hidden');
        }
        function showCountdown() {
            document.getElementById('countdown').classList.toggle('hidden');
            let countdownDate = new Date("Feb 14, 2025 00:00:00").getTime();
            let x = setInterval(function() {
                let now = new Date().getTime();
                let distance = countdownDate - now;
                let days = Math.floor(distance / (1000 * 60 * 60 * 24));
                document.getElementById("timer").innerHTML = days + " days left!";
            }, 1000);
        }
    </script>
</body>
</html>
